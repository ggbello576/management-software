<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazzino - Gestionale del salone</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="contenitore">
        <header class="intestazione">
            <div>
                <p class="soprattitolo">GESTIONALE DEL SALONE</p>
                <h1>Magazzino</h1>
                <a href="/">Torna alla panoramica</a>
            </div>
        </header>

        <section class="magazzino">
            <div class="tabella-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Prodotto</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Giacenza</th>
                            <th scope="col">Soglia di riordino</th>
                            <th scope="col">Prezzo di vendita</th>
                            <th scope="col">Stato</th>
                        </tr>
                    </thead>

                    <tbody id="corpo-magazzino">
                        <!-- JavaScript inserirà qui i prodotti -->
                    </tbody>
                </table>
            </div>
        </section>

        <section class="scheda-gestione">
            <h2>Rettifiche di magazzino</h2>
            <div class="tabella-gestione-scroll">
                <table class="tabella-gestione">
                    <thead>
                        <tr>
                            <th scope="col">Data</th>
                            <th scope="col">Prodotto</th>
                            <th scope="col">Variazione</th>
                            <th scope="col">Motivo</th>
                            <th scope="col">Azione</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-rettifiche-magazzino">
                        <tr>
                            <td colspan="5" class="tabella-vuota">Caricamento rettifiche…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
