<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazzino - Gestionale del salone</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="contenitore">
        <header class="intestazione">
            <div>
                <p class="soprattitolo">GESTIONALE DEL SALONE</p>
                <h1>Magazzino</h1>
                <a href="/">Torna alla panoramica</a>
            </div>
        </header>

        <nav class="navigazione" aria-label="Navigazione principale">
            <a href="/" class="pulsante-sezione">Panoramica</a>
            <a href="/magazzino" class="pulsante-sezione attivo">Magazzino</a>
            <a href="/rettifiche-magazzino" class="pulsante-sezione">Rettifiche magazzino</a>
            <a href="/acquisti" class="pulsante-sezione">Acquisti</a>
            <a href="/vendite" class="pulsante-sezione">Vendite</a>
            <a href="/clienti" class="pulsante-sezione">Clienti</a>
            <a href="/prodotti" class="pulsante-sezione">Prodotti</a>
            <a href="/servizi" class="pulsante-sezione">Servizi</a>
            <a href="/fornitori" class="pulsante-sezione">Fornitori</a>
            <a href="/conteggio-iniziale" class="pulsante-sezione">Conteggio iniziale</a>
        </nav>

        <section class="magazzino">
            <div class="tabella-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Prodotto</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Giacenza</th>
                            <th scope="col">Soglia di riordino</th>
                            <th scope="col">Prezzo di vendita</th>
                            <th scope="col">Stato</th>
                        </tr>
                    </thead>

                    <tbody id="corpo-magazzino">
                        <!-- JavaScript inserirà qui i prodotti -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
