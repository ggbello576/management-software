<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Gestionale del salone</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="contenitore pagina-login">
        <header class="intestazione">
            <div>
                <p class="soprattitolo">GESTIONALE DEL SALONE</p>
                <h1>Accedi</h1>
                <p class="descrizione-gestione">
                    Inserisci le credenziali dell'account autorizzato.
                </p>
            </div>
        </header>

        <form id="form-login" class="form-gestione">
            <div class="campo-gestione">
                <label for="email-login">Email</label>
                <input type="email" id="email-login" name="email" autocomplete="username" required>
            </div>

            <div class="campo-gestione">
                <label for="password-login">Password</label>
                <input type="password" id="password-login" name="password" autocomplete="current-password" minlength="8" required>
            </div>

            <button type="submit" class="pulsante-salva">Accedi</button>
            <p id="messaggio-login" class="messaggio-gestione" aria-live="polite"></p>
        </form>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
