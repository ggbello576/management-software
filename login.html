<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Gestionale del salone</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="pagina-login-body">
    <main class="contenitore pagina-login">
        <div class="dashboard-brand login-brand" aria-label="KIND SQL salone manager">
            <span class="dashboard-brand-mark" aria-hidden="true">K</span>
            <span>
                <strong>KIND SQL</strong>
                <small>salone manager</small>
            </span>
        </div>

        <header class="intestazione login-header">
            <h1>Accedi</h1>
        </header>

        <form id="form-login" class="form-gestione">
            <div class="campo-gestione">
                <label for="nome-utente-login">Nome utente</label>
                <input type="text" id="nome-utente-login" name="nomeUtente" autocomplete="username" maxlength="100" required>
            </div>

            <div class="campo-gestione">
                <label for="password-login">Password</label>
                <input type="password" id="password-login" name="password" autocomplete="current-password" minlength="8" required>
            </div>

            <button type="submit" class="pulsante-salva">Accedi</button>
            <p id="messaggio-login" class="messaggio-gestione" aria-live="polite"></p>
        </form>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
