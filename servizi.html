<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione servizi - Gestionale del salone</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="contenitore pagina-gestione">
        <header class="intestazione">
            <div>
                <p class="soprattitolo">GESTIONALE DEL SALONE</p>
                <h1>Gestione servizi</h1>
                <p class="descrizione-gestione">
                    Registra i servizi offerti dal salone senza modificare il magazzino.
                </p>
            </div>

            <a class="link-home" href="/">Torna alla panoramica</a>
        </header>

        <section class="scheda-gestione">
            <h2>Registra un servizio</h2>

            <form id="form-servizio" class="form-gestione">
                <div class="campi-gestione">
                    <div class="campo-gestione campo-gestione-largo">
                        <label for="nome-servizio">Nome</label>
                        <input type="text" id="nome-servizio" name="nome" required>
                    </div>

                    <div class="campo-gestione">
                        <label for="prezzo-servizio">Prezzo</label>
                        <input
                            type="number"
                            id="prezzo-servizio"
                            name="prezzo"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="pulsante-salva">Salva servizio</button>
            </form>

            <p id="messaggio-servizio" class="messaggio-gestione" aria-live="polite"></p>
        </section>

        <section class="scheda-gestione">
            <h2>Servizi presenti</h2>

            <div class="tabella-gestione-scroll">
                <table class="tabella-gestione">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Prezzo</th>
                            <th scope="col">Stato</th>
                        </tr>
                    </thead>

                    <tbody id="corpo-servizi">
                        <tr>
                            <td colspan="3" class="tabella-vuota">Caricamento servizi…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
